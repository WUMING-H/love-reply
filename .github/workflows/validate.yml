name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check skill integrity
        run: |
          set +e
          python scripts/validate_skill.py
          code=$?
          if [ $code -eq 1 ]; then
            echo "::error::完整性检查有硬错误"
            exit 1
          fi
          echo "通过（退出码 $code，2 表示只有警告）"

      - name: Style tool smoke test (accept)
        run: |
          python scripts/style_tool.py check --text "下周六开幕 我订两张" --strategy minimal

      - name: Style tool smoke test (reject)
        run: |
          if python scripts/style_tool.py check \
            --text "我理解你的感受，建议你先冷静一下，等她想通了自然会来找你。" \
            --strategy substantive; then
            echo "::error::AI 味长句未被拦截"
            exit 1
          else
            echo "正确拦截"
          fi

      - name: Profile from sample corpus
        run: |
          printf '%s\n' "刚看到 咋了" "行" "她那人事儿真多 你别往心里去" \
            "出来吃个饭？我请" "咋了" "嗯" "先这样 睡了啊" \
            "那你早点睡" "明天我过去接你" "别提了 今天累成狗" > /tmp/sample.txt
          LOVE_REPLY_HOME=/tmp/lr-data python scripts/style_tool.py profile \
            --file /tmp/sample.txt --slot ci

      - name: Profile tool end to end
        run: |
          export LOVE_REPLY_HOME=/tmp/lr-profile
          python scripts/profile_tool.py init --slot ci --alias 她 --stage couple_early
          python scripts/profile_tool.py add --slot ci --kind fact --text "她不吃芒果"
          python scripts/profile_tool.py add --slot ci --kind landmine --text "她说累的时候别讲道理"
          python scripts/profile_tool.py add --slot ci --kind promise --text "陪她看展" --due 2026-12-01
          python scripts/profile_tool.py brief --slot ci --query "她说今天好累"
          python scripts/profile_tool.py stats --slot ci
          python scripts/profile_tool.py export --slot ci

      - name: Self profile, goals and stage gate
        run: |
          export LOVE_REPLY_HOME=/tmp/lr-self
          python scripts/profile_tool.py self init
          python scripts/profile_tool.py self add --kind limit \
            --text "不接受异地" --forbid 搬过去
          python scripts/profile_tool.py self add --kind flaw \
            --text "她一沉默就连发三条" --forbid 在吗 怎么不回
          python scripts/profile_tool.py init --slot ci --stage repairing
          python scripts/profile_tool.py goal add --slot ci --kind advance \
            --hard --text "三个月内明确关系" --forbid 再看看
          python scripts/profile_tool.py brief --slot ci --query "她说累了"
          python scripts/profile_tool.py stage --name repairing

          # 踩底线必须被拦下
          if python scripts/profile_tool.py guard \
            --text "我下个月搬过去" --slot ci --strategy advance; then
            echo "::error::底线未被拦截"
            exit 1
          fi

          # 修复期禁止 advance，必须被拦下
          if python scripts/profile_tool.py guard \
            --text "下周末一起出去玩吧" --slot ci --stage repairing \
            --strategy advance; then
            echo "::error::阶段闸门未生效"
            exit 1
          fi

          # 合规候选必须放行
          python scripts/profile_tool.py guard \
            --text "是我没安排好" --slot ci --stage repairing --strategy repair
